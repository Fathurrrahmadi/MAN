version: "3.8"
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hams_db
    ports:
      - "3306:3306"
    volumes:
      - ./db.sql:/docker-entrypoint-initdb.d/init.sql

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    command: node gateway.js
    ports:
      - "3000:3000"
    depends_on:
      - db

  asset:
    build:
      context: .
      dockerfile: Dockerfile
    command: node asset-service.js
    ports:
      - "3001:3001"
    depends_on:
      - db

  ward:
    build:
      context: .
      dockerfile: Dockerfile
    command: node ward-service.js
    ports:
      - "3002:3002"
    depends_on:
      - db

  transfer:
    build:
      context: .
      dockerfile: Dockerfile
    command: node transfer-service.js
    ports:
      - "3003:3003"
    depends_on:
      - db

  auth:
    build:
      context: .
      dockerfile: Dockerfile
    command: node auth-service.js
    ports:
      - "3004:3004"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - gateway